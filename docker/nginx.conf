server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # config.js se reescribe en cada arranque del contenedor. Si el navegador lo
  # cachea, un cambio de entorno (por ejemplo apuntar a otra base) no toma efecto.
  location = /config.js {
    add_header Cache-Control "no-store" always;
  }

  # Los assets de Vite llevan hash en el nombre, asi que se pueden cachear para
  # siempre: un build nuevo genera nombres nuevos.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # SPA con React Router: cualquier ruta que no sea un archivo real devuelve el
  # index.html para que el router del navegador resuelva la navegacion. Sin esto,
  # recargar en /cotizaciones/<id> daria 404.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
