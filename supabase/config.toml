# project_id se sobreescribe automaticamente al correr `supabase link --project-ref <ref>`
project_id = "glazz"

# Puertos desplazados del rango por defecto (54321-54323) para poder correr el stack
# local de este proyecto en paralelo con el de otros proyectos Supabase de la misma
# maquina sin colisionar. Los valores por defecto quedan libres para quien los use.
[api]
enabled = true
port = 54421
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
major_version = 17

[studio]
enabled = true
port = 54423

# El bucket `empresa` (logo de la vidrieria) lo crea la migracion, no este archivo; aqui
# solo se deja explicito que el servicio de Storage se levanta en local, porque sin el
# `supabase start` no expone el endpoint y la subida del logo falla al probarla.
[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:5180"
additional_redirect_urls = ["https://localhost:5180"]
jwt_expiry = 3600
enable_signup = true
